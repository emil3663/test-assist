name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: python
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q

  visual:
    # TA-226: a separate job, not a step in `test` above, specifically so a
    # slow or flaky real-font-rendering check can never fail (or even
    # appear inside) the main offscreen suite's job - see
    # DESKTOP_STABILITY_MATRIX.md and tests/test_visual.py for why this
    # needs the real "windows" Qt platform plugin instead of `offscreen`.
    # continue-on-error: true so this lane cannot block anything that
    # gates on the workflow's overall conclusion (e.g. a branch-protection
    # rule) - only the `test` job's own status matters for that.
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
        working-directory: python
    env:
      # Deliberately not "offscreen" - conftest.py's os.environ.setdefault
      # only fills in its own default when nothing has already set this,
      # so setting it explicitly to "windows" here is what makes this job
      # exercise real font rasterization instead of silently running the
      # same offscreen path as the `test` job above.
      QT_QPA_PLATFORM: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements.txt

      - name: Run visual regression tests
        run: python -m pytest -q -m visual