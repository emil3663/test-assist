[pytest]
markers =
    visual: exercises real font rendering / on-screen layout (TA-226). Needs
        the real "windows" Qt platform plugin, not "offscreen" - excluded
        from the default run by addopts below. Run explicitly with
        `pytest -m visual`, without QT_QPA_PLATFORM set to offscreen. See
        tests/test_visual.py and DESKTOP_STABILITY_MATRIX.md.
addopts = -m "not visual"
# tests_e2e/ (TA-228) is a separate, local/manual black-box lane driving a
# built .exe via pywinauto - it needs a build and a Windows-only dependency
# neither of which the main suite requires, and cannot run from a source
# checkout alone. testpaths keeps it out of every default `pytest`/
# `pytest -q` invocation (local or CI); run it explicitly with
# `pytest tests_e2e` from python\. See tests_e2e/README.md.
testpaths = tests
